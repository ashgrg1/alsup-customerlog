<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Names to Remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f7f9fc;
    --ink:#0f1626; --muted:#65718c; --faint:#98a2b6;
    --line:#e4e8f0; --line-2:#eef1f6;
    --primary:#4f46e5; --primary-d:#4338ca; --primary-soft:#eceafe;
    --danger:#e0473c; --danger-soft:#fdecea;
    --shadow:0 1px 2px rgba(16,22,38,.04), 0 8px 24px rgba(16,22,38,.06);
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5;
    background-image:radial-gradient(circle at 15% -10%, #e7ecff 0%, rgba(231,236,255,0) 45%);}
  h1,.mono-face{font-family:"Space Grotesk",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,var(--primary),#7c74f0);
    display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35)}
  .mark svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand h1{font-size:21px;letter-spacing:-.01em;font-weight:700}
  .brand p{font-size:13px;color:var(--muted)}
  .tally{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 18px;text-align:center;box-shadow:var(--shadow)}
  .tally b{font-family:"Space Grotesk";font-size:24px;font-weight:700;line-height:1;color:var(--primary)}
  .tally span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

  .board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
  .pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

  .toolbar{display:flex;gap:9px;padding:14px;border-bottom:1px solid var(--line-2);align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 11px;transition:.15s}
  .search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .search svg{width:16px;height:16px;fill:none;stroke:var(--faint);stroke-width:2}
  .search input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:14px;padding:9px 0;color:var(--ink)}
  .btn{border:none;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#eef1f6}
  .btn-danger{background:var(--danger-soft);color:var(--danger)}
  .btn-danger:hover{background:#fbddd9}

  .sortbar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line-2)}
  .sortbar button{background:none;border:none;color:var(--muted);font:inherit;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
  .sortbar button:hover{color:var(--primary)}

  .list{max-height:62vh;overflow-y:auto}
  .row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line-2);transition:.12s}
  .row:hover{background:var(--surface-2)}
  .row.active{background:var(--primary-soft)}
  .row.active .name{color:var(--primary-d)}
  .avatar{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk";font-weight:600;font-size:14px;color:#fff}
  .row-main{flex:1;min-width:0}
  .name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-actions{display:flex;gap:3px;flex:0 0 auto}
  .ra{width:32px;height:32px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--faint);display:flex;align-items:center;justify-content:center;transition:.12s}
  .ra svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ra.edit:hover{background:var(--primary-soft);color:var(--primary)}
  .ra.del:hover{background:var(--danger-soft);color:var(--danger)}

  .empty-list{padding:44px 20px;text-align:center;color:var(--faint)}
  .empty-list svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;margin-bottom:10px}
  .empty-list p{font-size:13.5px}

  .detail{padding:22px}
  .detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;color:var(--faint);min-height:300px}
  .detail-empty .big{width:56px;height:56px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .detail-empty .big svg{width:26px;height:26px;fill:none;stroke:var(--faint);stroke-width:1.6}
  .detail-empty h3{color:var(--muted);font-size:16px;margin-bottom:4px;font-family:"Space Grotesk"}
  .detail-empty p{font-size:13px;max-width:240px}

  .d-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .avatar-lg{width:60px;height:60px;border-radius:15px;font-size:22px}
  .d-name{font-family:"Space Grotesk";font-size:22px;font-weight:700;letter-spacing:-.01em}

  .read-block{margin-bottom:16px}
  .read-block .lbl{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .read-block .val{font-size:15px;color:var(--ink);white-space:pre-wrap}
  .read-block .val.muted{color:var(--faint);font-style:italic}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);outline:none;transition:.15s;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:#fff}
  .field textarea{min-height:70px}

  .actions{display:flex;gap:9px;margin-top:20px}
  .actions .btn{flex:1;justify-content:center}
  .back-btn{display:none}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
  .foot-actions{display:flex;gap:8px}
  .foot .btn{font-size:12.5px;padding:7px 12px}
  .note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-top:14px;box-shadow:var(--shadow)}
  .note b{color:var(--ink)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .board{grid-template-columns:1fr}
    .detail-pane{display:none}
    .board.show-detail .list-pane{display:none}
    .board.show-detail .detail-pane{display:block}
    .back-btn{display:inline-flex}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <h1>Names to Remember</h1>
        <p>Every name you learn, in one place</p>
      </div>
    </div>
    <div class="tally"><b id="tally">0</b><span>names</span></div>
  </header>

  <div class="board" id="board">
    <section class="pane list-pane">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search a name…" autocomplete="off">
        </div>
        <button class="btn btn-primary" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add name</button>
      </div>
      <div class="sortbar">
        <span id="countLabel">0 names</span>
        <button id="sortBtn"><span id="sortLabel">A → Z</span></button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="pane detail-pane" id="detailPane">
      <div class="detail" id="detail"></div>
    </section>
  </div>

  <div class="foot">
    <span id="savedNote">Saved on this device</span>
    <div class="foot-actions">
      <button class="btn btn-ghost" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Back up</button>
      <button class="btn btn-ghost" id="importBtn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>Restore</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="note">
    <b>Tip:</b> the hint field is optional — a few words to jog your memory ("tall, blue cap, buys energy drinks") make a name far easier to recall next time. Keep it to friendly details, nothing private.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY="namesToRemember.v1";
let state={people:[],selectedId:null,editing:false,search:"",sortAZ:true};

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state.people));
      document.getElementById('savedNote').textContent="Saved on this device";}
  catch(e){document.getElementById('savedNote').textContent="Session only — use Back up to keep your list";}
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)state.people=JSON.parse(raw);}catch(e){state.people=[];}}

const esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function initials(n){const p=n.trim().split(/\s+/);return((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase()||"?";}
function avatarColor(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 58% 55%)`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

function filtered(){
  let arr=[...state.people];
  const q=state.search.trim().toLowerCase();
  if(q)arr=arr.filter(c=>c.name.toLowerCase().includes(q)||(c.hint||"").toLowerCase().includes(q));
  arr.sort((a,b)=>{const cmp=a.name.toLowerCase().localeCompare(b.name.toLowerCase());return state.sortAZ?cmp:-cmp;});
  return arr;
}
function renderTally(){
  document.getElementById('tally').textContent=state.people.length;
}
function renderList(){
  const list=document.getElementById('list');
  const arr=filtered();
  document.getElementById('countLabel').textContent=arr.length+(arr.length===1?" name":" names");
  if(!state.people.length){
    list.innerHTML=`<div class="empty-list"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11l-3 3-1.5-1.5"/></svg><p>No names yet.<br>Tap <b>Add name</b> to start.</p></div>`;return;}
  if(!arr.length){list.innerHTML=`<div class="empty-list"><p>No matches for “${esc(state.search)}”.</p></div>`;return;}
  list.innerHTML=arr.map(c=>`
    <div class="row ${c.id===state.selectedId?'active':''}" data-id="${c.id}">
      <div class="avatar" style="background:${avatarColor(c.name)}">${esc(initials(c.name))}</div>
      <div class="row-main">
        <div class="name">${esc(c.name)}</div>
        <div class="preview">${c.hint?esc(c.hint):'—'}</div>
      </div>
      <div class="row-actions">
        <button class="ra edit" data-edit="${c.id}" title="Edit" aria-label="Edit ${esc(c.name)}"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
        <button class="ra del" data-del="${c.id}" title="Delete" aria-label="Delete ${esc(c.name)}"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>
    </div>`).join("");
}
function renderDetail(){
  const d=document.getElementById('detail');
  const board=document.getElementById('board');
  const c=state.people.find(x=>x.id===state.selectedId);

  if(state.editing){
    const isNew=!c;
    const cur=c||{name:"",hint:""};
    d.innerHTML=`
      <button class="btn btn-ghost back-btn" id="backBtn" style="margin-bottom:16px"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
      <div class="field"><label>Name</label><input id="fName" type="text" placeholder="e.g. Maria Alvarez" value="${esc(cur.name)}" maxlength="60"></div>
      <div class="field"><label>Hint to remember (optional)</label><textarea id="fHint" placeholder="tall, blue cap, buys energy drinks">${esc(cur.hint||"")}</textarea></div>
      <div class="actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>${isNew?'Save name':'Save changes'}</button>
      </div>`;
    board.classList.add('show-detail');
    const nameEl=document.getElementById('fName');nameEl.focus();
    function commit(){
      const name=nameEl.value.trim();
      if(!name){toast("Please enter a name");nameEl.focus();return;}
      const hint=document.getElementById('fHint').value.trim();
      if(isNew){const nc={id:uid(),name,hint};state.people.push(nc);state.selectedId=nc.id;toast("Name saved");}
      else{c.name=name;c.hint=hint;toast("Saved");}
      state.editing=false;save();renderAll();
    }
    document.getElementById('saveBtn').onclick=commit;
    nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}});
    document.getElementById('cancelBtn').onclick=()=>{state.editing=false;if(isNew)state.selectedId=null;renderAll();};
    document.getElementById('backBtn').onclick=()=>{state.editing=false;if(isNew)state.selectedId=null;board.classList.remove('show-detail');renderAll();};
    return;
  }

  if(!c){
    board.classList.remove('show-detail');
    d.innerHTML=`<div class="detail-empty"><div class="big"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><h3>Pick a name</h3><p>Tap someone on the left to see their hint, or add a new name.</p></div>`;return;
  }

  board.classList.add('show-detail');
  d.innerHTML=`
    <button class="btn btn-ghost back-btn" id="backBtn" style="margin-bottom:16px"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to list</button>
    <div class="d-head">
      <div class="avatar avatar-lg" style="background:${avatarColor(c.name)}">${esc(initials(c.name))}</div>
      <div class="d-name">${esc(c.name)}</div>
    </div>
    <div class="read-block"><div class="lbl">Hint</div><div class="val ${c.hint?'':'muted'}">${c.hint?esc(c.hint):'No hint yet — add a detail to help you recall this name.'}</div></div>
    <div class="actions">
      <button class="btn btn-danger" id="delBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Delete</button>
      <button class="btn btn-primary" id="editBtn"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Edit</button>
    </div>`;
  document.getElementById('editBtn').onclick=()=>{state.editing=true;renderDetail();};
  document.getElementById('backBtn').onclick=()=>{state.selectedId=null;board.classList.remove('show-detail');renderAll();};
  document.getElementById('delBtn').onclick=()=>{
    if(confirm(`Delete “${c.name}”? This can’t be undone.`)){
      state.people=state.people.filter(x=>x.id!==c.id);state.selectedId=null;state.editing=false;save();toast("Deleted");renderAll();
    }
  };
}
function renderAll(){renderTally();renderList();renderDetail();}

document.getElementById('list').addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');
  if(ed){state.selectedId=ed.dataset.edit;state.editing=true;renderDetail();return;}
  const dl=e.target.closest('[data-del]');
  if(dl){const c=state.people.find(x=>x.id===dl.dataset.del);
    if(c&&confirm(`Delete “${c.name}”? This can’t be undone.`)){
      state.people=state.people.filter(x=>x.id!==c.id);
      if(state.selectedId===c.id){state.selectedId=null;state.editing=false;}
      save();toast("Deleted");renderAll();}
    return;}
  const row=e.target.closest('.row');
  if(row){state.selectedId=row.dataset.id;state.editing=false;renderAll();}
});
document.getElementById('addBtn').onclick=()=>{state.selectedId=null;state.editing=true;renderDetail();};
document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;renderList();});
document.getElementById('sortBtn').onclick=()=>{state.sortAZ=!state.sortAZ;document.getElementById('sortLabel').textContent=state.sortAZ?"A → Z":"Z → A";renderList();};

document.getElementById('exportBtn').onclick=()=>{
  if(!state.people.length){toast("Nothing to back up yet");return;}
  const blob=new Blob([JSON.stringify(state.people,null,2)],{type:"application/json"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download="names-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded");
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;
    const clean=data.filter(x=>x&&x.name).map(x=>({id:x.id||uid(),name:String(x.name),hint:x.hint?String(x.hint):(x.note?String(x.note):"")}));
    if(confirm(`Restore ${clean.length} name(s)? This replaces your current list.`)){
      state.people=clean;state.selectedId=null;state.editing=false;save();renderAll();toast("List restored");}
  }catch(err){toast("That file couldn’t be read");}e.target.value="";};
  r.readAsText(f);
});

load();renderAll();
</script>
</body>
</html>
